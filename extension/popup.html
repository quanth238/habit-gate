<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Habit Gate</title><link rel="icon" type="image/svg+xml" href="brand.svg"><link rel="stylesheet" href="ui.css"><script type="module" src="page.js"></script></head>
<body class="popup" data-access="blocked"><header class="popup-header"><div class="brand"><img src="brand.svg" alt="" width="30" height="30"><span>Habit Gate</span></div><span class="status-dot" aria-hidden="true"></span></header><main class="popup-main"><p class="section-label">A LITTLE INTENTION, EVERY DAY</p><h1 id="title">Your habits come first.</h1><p class="subtitle" id="reason">Checking your essential habits…</p><section class="essentials" aria-label="Essential habits"><div class="progress-caption"><span id="count">Checking</span><span id="progress-percent">0%</span></div><progress id="progress" max="1" value="0" aria-label="Essential habit progress"></progress><ul id="habits"></ul></section><div class="actions"><button id="open" class="primary">Open Habitify <span aria-hidden="true">↗</span></button><button id="sync" class="secondary">Sync now</button></div><p class="status" id="status" role="status" aria-live="polite"></p><button id="permissions" class="permission-button" hidden>Grant access to configured websites</button><p class="date" id="date"></p><details class="coverage-details"><summary>Website protection &amp; profile</summary><p id="coverage" role="status">Checking coverage…</p><label for="profile-label">Local profile label</label><input id="profile-label" maxlength="60" autocomplete="off"><button id="save-label">Save label</button><button id="test">Test protection</button><p id="test-result" role="status">A test can run while your rules are active and locked.</p></details><p class="coverage-note">Configured Chrome profiles only. Safari is not protected.</p></main></body></html>
